# Desktop builds for Linux, Windows and macOS.
#
#   Push a tag like v0.2.0  -> tests, builds all three, and attaches them to a *draft*
#                              GitHub Release. Nothing is public until you publish it.
#   Run it from the Actions tab ("Run workflow") -> same builds, downloadable from the
#                              run page as artifacts, no release.
#
# The tag has to match the VERSION file. Easiest: `/tag-version major|minor|patch` in
# Claude Code (bumps VERSION, syncs package.json and Cargo.toml, commits, tags), then
# `git push && git push origin v<x.y.z>`.
#
# Builds are unsigned, so Windows SmartScreen and macOS Gatekeeper will warn on first
# open. Phones and the app stores stay with build/android.sh and build/ios.sh.

name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the draft release and upload to it

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No lockfile in the repo, so install from package.json's ranges.
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test

      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION ($version). Tag releases with /tag-version so the two always agree."
            exit 1
          fi

      # One draft release, made here, so the three parallel builds don't each make their
      # own (drafts can't be looked up by tag). The name comes from brand.json.
      - name: Draft release
        id: release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(node -p "require('./brand.json').name")
          find() { gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1; }
          id=$(find)
          if [ -z "$id" ]; then
            cat > notes.md <<'NOTES'
          **Linux:** the `.AppImage` runs on most distros (`chmod +x`, then open it). Or install the `.deb` (Debian, Ubuntu) or `.rpm` (Fedora).
          **Windows:** run the `-setup.exe`. If SmartScreen says "Windows protected your PC", click **More info**, then **Run anyway**.
          **macOS:** open the `.dmg` and drag the app to Applications. The first time, macOS will block it: go to **System Settings > Privacy & Security** and click **Open Anyway**.

          Your projects are plain folders, so installing over an older version never touches them.
          NOTES
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$name ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
            id=$(find)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's older glibc means the .deb and AppImage also run on older distros.
          - platform: linux
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          # NSIS only: the .msi needs VBScript, which newer Windows images leave off.
          - platform: windows
            os: windows-latest
            args: --bundles nsis
          # One build for both Apple Silicon and Intel Macs.
          - platform: macos
            os: macos-latest
            args: --target universal-apple-darwin
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      # No lockfile in the repo, so install from package.json's ranges.
      - run: npm install --no-audit --no-fund

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Tag pushes upload to the draft made above; manual runs just keep the artifacts.
          releaseId: ${{ needs.test.outputs.release }}
          uploadWorkflowArtifacts: true
