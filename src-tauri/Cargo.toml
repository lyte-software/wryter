[package]
name = "authorbox"
version = "0.1.0"
description = "A focused writing app with linked characters, places and items"
authors = ["Rogue Wolf"]
edition = "2021"

[lib]
name = "authorbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
