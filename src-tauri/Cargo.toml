[package]
name = "wryter"
version = "0.1.0"
description = "A focused writing app with linked characters, places and items"
authors = ["Rogue Wolf"]
license = "MIT"
edition = "2021"

[lib]
# Fixed internal name, so renaming the app never touches Rust code.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
